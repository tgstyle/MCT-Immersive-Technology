import groovy.json.JsonOutput
import groovy.json.JsonSlurper
import net.minecraftforge.gradle.common.tasks.SignJar

plugins {
    id 'idea'
    id 'maven-publish'
    id 'net.minecraftforge.gradle' version '6.0.+'
    id 'org.spongepowered.mixin' version '0.7.+'
    id 'org.parchmentmc.librarian.forgegradle' version '1.+'
    id 'org.jetbrains.gradle.plugin.idea-ext' version '1.1.6'
    id 'eclipse'
}

configurations.configureEach {
    resolutionStrategy {
        force 'com.google.guava:guava:32.1.3-jre'
    }
}

def versionProps = new Properties()
file('version.properties').withInputStream { versionProps.load(it) }

def gradleProps = new Properties()
file('gradle.properties').withInputStream { gradleProps.load(it) }

version = versionProps.getProperty('version')
ext.version_buildnumber = versionProps.getProperty('build_number')?.toInteger() ?: 0
ext.stage = versionProps.getProperty('stage') ?: ''

println "-> build.gradle applying version: $version (build ${version_buildnumber})"

group = 'mctmods.immersivetechnology'

java.toolchain.languageVersion = JavaLanguageVersion.of(17)

tasks.withType(Jar).configureEach {
    zip64 = true
}

sourceSets {
    main {
        java {
            srcDirs = ["$rootDir/src/main/java"]
        }
        resources {
            srcDirs = [
                    "$rootDir/src/main/resources",
                    "$rootDir/src/generated/resources",
            ]
        }
    }
    datagen {
        java {
            srcDirs = ["$rootDir/src/datagen/java"]
        }
        resources {
            srcDirs = ["$rootDir/src/datagen/resources"]
        }
        compileClasspath += main.compileClasspath
        runtimeClasspath += main.runtimeClasspath
        compileClasspath += main.output
        runtimeClasspath += main.output
    }
    gametest {
        java {
            srcDirs = ["$rootDir/src/gametest/java"]
        }
        resources {
            srcDirs = ["$rootDir/src/gametest/resources"]
        }
        compileClasspath += main.compileClasspath
        runtimeClasspath += main.runtimeClasspath
        compileClasspath += main.output
        runtimeClasspath += main.output
    }
}

ext {
    mod_id = gradleProps['mod_id']
    version_minecraft = versionProps['version_mc']
    version_forge = versionProps['version_forge']
    version_forge_min = versionProps['version_forge_min']
    version_jei = versionProps['version_jei']
    version_parchment = versionProps['version_parchment']
    version_ie = versionProps['version_ie']
    version_ie_full = "${version_minecraft}-${version_ie}"
    version_ie_curse = versionProps['version_ie_curse']
    version_ic = versionProps['version_ic']
    version_ic_curse = versionProps['version_ic_curse']
    version_engineered_schematics_curse = versionProps['version_engineered_schematics_curse']
    version_jade_curse = versionProps['version_jade_curse']
    version_top_curse = versionProps['version_top_curse']
    version_journeymap_curse = versionProps['version_journeymap_curse']
    version_puzzleslib_curse = versionProps['version_puzzleslib_curse']
    version_held_item_tooltips_curse = versionProps['version_held_item_tooltips_curse']
    version_mixin = versionProps['version_mixin']
    mod_license = gradleProps['mod_license']
    mod_name = gradleProps['mod_name']
    mod_authors = gradleProps['mod_authors']
    mod_description = gradleProps['mod_description']
}

def version_replaces = { [
        'version'      : project.version,
        'build_number' : version_buildnumber,
        'version_mc'   : version_minecraft,
        'version_forge': version_forge,
        'version_forge_min': version_forge_min,
        'version_jei'  : version_jei,
        'mod_license'  : mod_license,
        'mod_name'     : mod_name,
        'mod_authors'  : mod_authors,
        'mod_description': mod_description,
        'version_ie'   : version_ie_full,
        'version_ic'   : version_ic,
        'stage'        : stage,
] as Map<String, Object> }

def jsonPatterns = ["**/*.json", "**/*.mcmeta"]

processResources {
    duplicatesStrategy = DuplicatesStrategy.FAIL
    inputs.properties(version_replaces())
    filesMatching("META-INF/mods.toml") {
        expand version_replaces()
    }
    exclude ".cache"
    doLast {
        fileTree(dir: getOutputs().getFiles().getAsPath(), includes: jsonPatterns).each {
            File file -> file.setText(JsonOutput.toJson(new JsonSlurper().parse(file, 'UTF-8')))
        }
    }
}

tasks.register('copyModsTomlForIntelliJ', Copy) {
    from processResources.destinationDir
    into "$projectDir/out/production/resources"
    include "META-INF/mods.toml"
    dependsOn processResources
}

def icJar = null
def icDir = file('../ImmersiveConvergence/build/libs')
def matchingJars = fileTree(icDir) {
    include "ImmersiveConvergence-${version_minecraft}-*-dev.jar"
    exclude "**/*-sources.jar"
}.files

if (!matchingJars.isEmpty()) {
    icJar = matchingJars.sort { a, b -> b.lastModified() <=> a.lastModified() }.last()
    logger.lifecycle("✅ Found IC deobf JAR: ${icJar.name}")
} else {
    logger.warn('⚠️  No IC deobf JAR found')
}

minecraft {
    mappings channel: 'parchment', version: version_parchment + '-' + version_minecraft
    accessTransformer { file('src/main/resources/META-INF/accesstransformer.cfg') }
    runs {
        client {
            workingDirectory = project.file('run')
            property 'forge.logging.markers', ''
            property 'forge.enabledGameTestNamespaces', mod_id
            ideaModule project.name + ".main"
            mods {
                immersivetechnology {
                    source(sourceSets.main as SourceSet)
                }
            }
            args '--username', 'tgstyle'
            args '--width', '1920'
            args '--height', '1080'
        }
        server {
            workingDirectory = project.file('run')
            property 'forge.logging.markers', ''
            property 'forge.enabledGameTestNamespaces', mod_id
            arg '-nogui'
            mods {
                immersivetechnology {
                    source(sourceSets.main as SourceSet)
                }
            }
        }
        data {
            workingDirectory = project.file('run')
            property 'forge.logging.markers', ''
            property 'fml.earlyprogresswindow', 'false'
            args '--mod', mod_id, '--all', '--output', file('src/generated/resources/'), '--validate',
                    '--existing', sourceSets.main.resources.srcDirs.first()
            ideaModule project.name + ".datagen"
            mods {
                immersivetechnology {
                    source(sourceSets.main as SourceSet)
                    source(sourceSets.datagen as SourceSet)
                }
            }
        }
        gameTestServer {
            workingDirectory = project.file('run')
            property 'forge.logging.markers', ''
            property 'forge.enabledGameTestNamespaces', mod_id
            ideaModule project.name + ".gametest"
            mods {
                immersivetechnology {
                    source(sourceSets.main as SourceSet)
                    source(sourceSets.gametest as SourceSet)
                }
            }
        }
    }
}

repositories {
    maven { url = 'https://repo.spongepowered.org/repository/maven-public/' }
    maven {
        name = 'Jared maven'
        url = 'https://maven.blamejared.com/'
    }
    maven {
        url = 'https://www.cursemaven.com'
        content {
            includeGroup "curse.maven"
        }
    }
    maven {
        url = "https://cfa2.cursemaven.com"
        content {
            includeGroup "curse.maven"
        }
    }
    maven {
        url = 'https://squiddev.cc/maven/'
        content {
            includeGroup("cc.tweaked")
            includeModule("org.squiddev", "Cobalt")
        }
    }
    maven {
        name = 'ParchmentMC'
        url = 'https://ldtteam.jfrog.io/artifactory/parchmentmc-public/'
    }
}

mixin {
    add sourceSets.main, "${mod_id}.refmap.json"
    config "mixins.${mod_id}.json"
}

dependencies {
    minecraft "net.minecraftforge:forge:${version_minecraft}-${version_forge}"

    compileOnly fg.deobf("mezz.jei:jei-${version_minecraft}-forge-api:${version_jei}")
    compileOnly fg.deobf("mezz.jei:jei-${version_minecraft}-common-api:${version_jei}")

    implementation fg.deobf("mezz.jei:jei-${version_minecraft}-forge:${version_jei}")

    implementation fg.deobf("curse.maven:${version_ie_curse}")
    implementation fg.deobf("curse.maven:${version_engineered_schematics_curse}")

    implementation fg.deobf("curse.maven:${version_jade_curse}")
    implementation fg.deobf("curse.maven:${version_top_curse}")

    implementation fg.deobf("curse.maven:${version_journeymap_curse}")
    implementation fg.deobf("curse.maven:${version_puzzleslib_curse}")
    implementation fg.deobf("curse.maven:${version_held_item_tooltips_curse}")

    datagenImplementation fg.deobf("blusunrize.immersiveengineering:ImmersiveEngineering:${version_ie_full}:datagen")

    annotationProcessor "org.spongepowered:mixin:${version_mixin}:processor"

    if (icJar != null) {
        implementation files(icJar)
    } else {
        implementation fg.deobf("curse.maven:${version_ic_curse}")
    }
}

def customGradle = rootProject.file('custom.gradle')
if (customGradle.exists()) {
    apply from: customGradle
}

tasks.register('bumpVersion') {
    doLast {
        def props = new Properties()
        file('version.properties').withInputStream { props.load(it) }
        def currentBuild = props['build_number'].toInteger()
        def nextBuild = currentBuild + 1
        props['build_number'] = nextBuild.toString()
        file('version.properties').withOutputStream { props.store(it, null) }
        ext.version_buildnumber = nextBuild
        def stage = props['stage']
        def newVersion = "${props['version']}-b${nextBuild}-${stage}"
        project.version = newVersion
        tasks.withType(Jar).configureEach {
            it.archiveVersion.set(newVersion)
        }
    }
}

tasks.register('signJar', SignJar) {
    onlyIf {
        project.hasProperty('keyStore')
    }
    if (project.hasProperty('keyStore')) {
        keyStore = project.keyStore
        alias = project.storeAlias
        storePass = project.storePass
        keyPass = project.storePass
        inputFile = jar.archiveFile.get().asFile
        outputFile = jar.archiveFile.get().asFile
    } else {
        logger.warn("No key store found, not signing the output jar\n")
    }
}

build.dependsOn bumpVersion, signJar

tasks.register('datagenJar', Jar) {
    dependsOn datagenClasses
    archiveBaseName.set("MCT-ImmersiveTechnology-${version_minecraft}")
    archiveClassifier = 'datagen'
    from sourceSets.datagen.output
    manifest {
        attributes "FMLModType": "GAMELIBRARY"
    }
}

tasks.register('sourcesJar', Jar) {
    dependsOn classes
    archiveBaseName.set("MCT-ImmersiveTechnology-${version_minecraft}")
    archiveClassifier = 'sources'
    from sourceSets.main.allSource
    from sourceSets.datagen.allSource
}

artifacts {
    archives sourcesJar
    archives datagenJar
}

tasks.register('optimizePng') {
    def pngPatterns = ["**/*.png"]
    def resourceDirs = sourceSets.main.resources.srcDirs
    def pngFiles = resourceDirs.collectMany { dir -> fileTree(dir: dir, includes: pngPatterns).files as List }
    def execOps = project.services.get(ExecOperations)
    doLast {
        pngFiles.each { File file ->
            long size = file.length()
            execOps.exec {
                executable 'optipng'
                args '-q', '-o7', '-zm1-9', '-strip', 'all', file.absolutePath
            }
            long newSize = file.length()
            if (newSize < size) {
                System.out.format("Reduced File size of %s from %d bytes to %d bytes (reduced by %.2f%%)\n",
                        file, size, newSize, ((double) (size - newSize)) / ((double) size) * 100.0)
            }
        }
    }
}

tasks.register('optimizeOgg') {
    def soundsDir = file('src/main/resources/assets/immersivetechnology/sounds')
    def oggFiles = fileTree(dir: soundsDir, includes: ["**/*.ogg"]).files as List
    def scriptPath = "${System.getProperty('user.home')}/.optivorbis/optivorbis-inplace.sh"
    doLast {
        oggFiles.each { File oggFile ->
            long size = oggFile.length()
            def process = new ProcessBuilder(scriptPath, oggFile.absolutePath)
                    .redirectErrorStream(true)
                    .start()
            def output = process.inputStream.text
            int exitCode = process.waitFor()
            if (exitCode != 0) { throw new GradleException("optivorbis-inplace.sh failed for ${oggFile}: ${output}") }
            long newSize = oggFile.length()
            if (newSize < size) {
                System.out.format("Reduced File size of %s from %d bytes to %d bytes (reduced by %.2f%%)\n",
                        oggFile, size, newSize, ((double) (size - newSize)) / ((double) size) * 100.0)
            }
        }
    }
}

tasks.register('genIntellijRunsDummy')

tasks.withType(Task).configureEach {
    if (it.name == "genIntellijRuns") {
        genIntellijRunsDummy.dependsOn it
    } else if (it.name == "runServer") {
        it.standardInput = System.in
    }
}

processResources.dependsOn bumpVersion
jar.dependsOn bumpVersion
datagenJar.dependsOn bumpVersion
sourcesJar.dependsOn bumpVersion

jar {
    archiveBaseName.set("MCT-ImmersiveTechnology-${version_minecraft}")
    archiveClassifier.set('')
}