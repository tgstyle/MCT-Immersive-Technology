plugins {
    id 'idea'
    id 'java'
    id 'com.gtnewhorizons.retrofuturagradle' version '2.0.2'
}

ext.configFile = file '../common/common-1.12.properties'

configFile.withReader {
    def prop = new Properties()
    prop.load(it)
    ext.common = new ConfigSlurper().parse prop
}

def versionProps = new Properties()
file('version.properties').withInputStream { versionProps.load(it) }

def gradleProps = new Properties()
file('gradle.properties').withInputStream { gradleProps.load(it) }

ext.modversion = versionProps.getProperty('version')
ext.version_buildnumber = versionProps.getProperty('build_number')?.toInteger() ?: 0
ext.stage = versionProps.getProperty('stage') ?: ''

version = "${common.mcversion}-${modversion}.${version_buildnumber}-${stage}"

println "-> build.gradle applying version: $version"

group = modgroup

ext {
    mod_id = gradleProps['mod_id']
    mod_name = gradleProps['mod_name']
    mod_authors = gradleProps['mod_authors']
    mod_description = gradleProps['mod_description']
    mod_url = gradleProps['mod_url']
}

base { archivesName = modarchivename }

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(8)
        vendor = JvmVendorSpec.ADOPTIUM
    }
}

minecraft {
    mcVersion = '1.12.2'
    mcpMappingChannel = 'stable'
    mcpMappingVersion = common.mcp_mappings.toString().split('-')[0]
    username = 'tgstyle'
    extraRunJvmArguments.addAll(
            '-Dfml.coreMods.load=mctmods.immersivetechnology.core.MCTMixin',
            '-Dforge.logging.console.level=debug'
    )
}

tasks.matching { it.name in ['deobfuscateMergedJarToSrg', 'srgifyBinpatchedJar'] }.configureEach {
    accessTransformerFiles.from('src/main/resources/META-INF/it_at.cfg')
}

repositories {
    maven {
        url = "https://cursemaven.com"
        content { includeGroup "curse.maven" }
    }
    maven { url = 'https://jitpack.io' }
    maven { url = 'https://maven.blamejared.com' }
    maven { url = 'https://repo.spongepowered.org/repository/maven-public/' }
    maven { url = 'https://maven.minecraftforge.net' }
    maven { url = 'https://maven.cleanroommc.com' }
    mavenCentral()
}

def icJar = null
def icDir = file('../ImmersiveConvergence-Legacy/build/libs')
def icJars = icDir.exists() ? fileTree(icDir) {
    include '*-dev.jar'
    exclude '**/*-sources.jar'
}.files : []

if (!icJars.isEmpty()) {
    icJar = icJars.sort { a, b -> a.lastModified() <=> b.lastModified() }.last()
    logger.lifecycle("Found Immersive Convergence dev JAR: ${icJar.name}")
} else {
    logger.warn('No Immersive Convergence dev JAR found in ../ImmersiveConvergence-Legacy/build/libs, build one there first')
}

dependencies {
    if (icJar != null) {
        implementation files(icJar)
    }
    implementation rfg.deobf("${common.mjei_version}")
    implementation rfg.deobf("curse.maven:${common.imme_version}")
    implementation rfg.deobf("curse.maven:${common.mtop_version}")
    implementation rfg.deobf("curse.maven:${common.woed_version}")
    implementation rfg.deobf("curse.maven:${common.wcui_version}")

    compileOnly rfg.deobf("curse.maven:${common.hwya_version}")
    compileOnly rfg.deobf("curse.maven:${common.advr_version}")
    compileOnly rfg.deobf("curse.maven:${common.libv_version}")
    compileOnly rfg.deobf("curse.maven:${common.opcm_version}")

    compileOnly rfg.deobf("${common.crft_version}")
    compileOnly rfg.deobf("${common.zens_version}")

    runtimeOnly rfg.deobf("${common.ctwk_version}")
    runtimeOnly rfg.deobf("curse.maven:${common.mkce_version}")

    implementation rfg.deobf("curse.maven:${common.ppfx_version}")
    implementation rfg.deobf("curse.maven:${common.cfga_version}")

    implementation rfg.deobf("curse.maven:${common.liti_version}")
    implementation rfg.deobf("curse.maven:${common.crce_version}")

    annotationProcessor 'org.ow2.asm:asm-debug-all:5.2'
    annotationProcessor 'com.google.guava:guava:32.1.2-jre'
    annotationProcessor 'com.google.code.gson:gson:2.8.9'
    String mixinBooter = modUtils.enableMixins('zone.rong:mixinbooter:10.7', 'mixins.immersivetech.refmap.json')
    api(mixinBooter) { transitive = false }
    annotationProcessor(mixinBooter) { transitive = false }
}

tasks.named('runClient').configure {
    extraArgs.addAll('--width', '1920', '--height', '1080')
}

tasks.register('runClientGamescope', Exec) {
    workingDir = projectDir
    commandLine 'bash', '-c', 'set -o pipefail; gamescope -W 1920 -H 1080 -- ./gradlew --no-daemon runClient 2>&1 ' + '| grep --line-buffered -v "xdg_backend: Changed refresh"'
}

tasks.named('runServer').configure {
    workingDir = file('run/server')
}

tasks.register('bumpVersion') {
    doLast {
        def requested = gradle.startParameter.taskNames*.toLowerCase()
        if (!requested.any { it.contains('build') || it.contains('jar') || it.contains('assemble') }) { return }

        def props = new Properties()
        file('version.properties').withInputStream { props.load(it) }
        def currentBuild = props['build_number'].toInteger()
        def nextBuild = currentBuild + 1
        props['build_number'] = nextBuild.toString()
        file('version.properties').withOutputStream { props.store(it, null) }

        ext.version_buildnumber = nextBuild
        def newStage = props['stage'] ?: ''
        def newVersion = "${common.mcversion}-${props['version']}.${nextBuild}-${newStage}"

        project.version = newVersion
        tasks.withType(Jar).configureEach {
            it.archiveVersion.set(newVersion)
        }
    }
}

build.dependsOn bumpVersion
processResources.dependsOn bumpVersion
jar.dependsOn bumpVersion

processResources {
    inputs.property('version', providers.provider { "${modversion}.${version_buildnumber}" })
    inputs.property 'mcversion', common.mcversion
    filesMatching(['mcmod.info', 'pack.mcmeta']) {
        expand 'version': "${modversion}.${version_buildnumber}", 'mcversion': common.mcversion,
                'mod_id': mod_id, 'mod_name': mod_name,
                'mod_authors': mod_authors, 'mod_description': mod_description,
                'mod_url': mod_url, 'mod_mixin_id': "${mod_id}_mixin"
    }
    duplicatesStrategy = DuplicatesStrategy.INCLUDE
}

jar {
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    manifest {
        attributes(
                'FMLCorePlugin': 'mctmods.immersivetechnology.core.MCTMixin',
                'FMLCorePluginContainsFMLMod': 'true'
        )
    }
}

sourceSets.configureEach { it.output.resourcesDir = it.output.classesDirs.getFiles().iterator().next() }

tasks.register('optimizePng') {
    def pngPatterns = ["**/*.png"]
    def resourceDirs = sourceSets.main.resources.srcDirs
    def pngFiles = resourceDirs.collectMany { dir -> fileTree(dir: dir, includes: pngPatterns).files as List }
    def execOps = project.services.get(ExecOperations)
    doLast {
        pngFiles.each { File file ->
            long size = file.length()
            execOps.exec {
                executable 'optipng'
                args '-q', '-o7', '-zm1-9', '-nc', '-strip', 'all', file.absolutePath
            }
            long newSize = file.length()
            if (newSize < size) {
                System.out.format("Reduced File size of %s from %d bytes to %d bytes (reduced by %.2f%%)\n",
                        file, size, newSize, ((double) (size - newSize)) / ((double) size) * 100.0)
            }
        }
    }
}

tasks.register('optimizeOgg') {
    def soundsDir = file('src/main/resources/assets/immersivetech/sounds')
    def oggFiles = fileTree(dir: soundsDir, includes: ["**/*.ogg"]).files as List
    def scriptPath = "${System.getProperty('user.home')}/.optivorbis/optivorbis-inplace.sh"
    doLast {
        oggFiles.each { File oggFile ->
            long size = oggFile.length()
            def process = new ProcessBuilder(scriptPath, oggFile.absolutePath)
                    .redirectErrorStream(true)
                    .start()
            def output = process.inputStream.text
            int exitCode = process.waitFor()
            if (exitCode != 0) { throw new GradleException("optivorbis-inplace.sh failed for ${oggFile}: ${output}") }
            long newSize = oggFile.length()
            if (newSize < size) {
                System.out.format("Reduced File size of %s from %d bytes to %d bytes (reduced by %.2f%%)\n",
                        oggFile, size, newSize, ((double) (size - newSize)) / ((double) size) * 100.0)
            }
        }
    }
}