plugins {
    id 'net.minecraftforge.gradle' version '5.1.72'
    id 'com.github.johnrengelman.shadow' version '7.1.2'
    id 'wtf.gofancy.fancygradle' version '1.1.3-0'
    id 'org.spongepowered.mixin' version '0.7-SNAPSHOT'
}

ext.configFile = file '../common/common-1.12.properties'

configFile.withReader {
    def prop = new Properties()
    prop.load(it)
    ext.common = new ConfigSlurper().parse prop
}

def versionProps = new Properties()
file('version.properties').withInputStream { versionProps.load(it) }

ext.modversion = versionProps.getProperty('version')
ext.version_buildnumber = versionProps.getProperty('build_number')?.toInteger() ?: 0
ext.stage = versionProps.getProperty('stage') ?: ''

version = "${common.mcversion}-${modversion}.${version_buildnumber}-${stage}"

println "-> build.gradle applying version: $version"

java.toolchain.languageVersion = JavaLanguageVersion.of(8)

compileJava {
    sourceCompatibility = '8'
    targetCompatibility = '8'
}

repositories {
    maven {
        url = "https://cursemaven.com"
        content { includeGroup "curse.maven" }
    }
    maven { url = 'https://jitpack.io' }
    maven { url = 'https://maven.blamejared.com' }
    maven { url = 'https://repo.spongepowered.org/repository/maven-public/' }
    maven { url = 'https://maven.minecraftforge.net' }
    maven { url = 'https://maven.neoforged.net/releases' }
    maven { url = 'https://maven.gofancy.wtf/releases' }
    maven { url = 'https://maven.cleanroommc.com' }
    mavenCentral()
    gradlePluginPortal()
}

group = modgroup

archivesBaseName = modarchivename

dependencies {
    minecraft "net.minecraftforge:forge:${common.mcversion}-${common.forgeversion}"

    implementation fg.deobf("${common.mjei_version}")
    implementation fg.deobf("curse.maven:${common.imme_version}")
    implementation fg.deobf("curse.maven:${common.mtop_version}")
    implementation fg.deobf("curse.maven:${common.woed_version}")
    implementation fg.deobf("curse.maven:${common.wcui_version}")

    compileOnly fg.deobf("curse.maven:${common.hwya_version}")
    compileOnly fg.deobf("curse.maven:${common.advr_version}")
    compileOnly fg.deobf("curse.maven:${common.libv_version}")
    compileOnly fg.deobf("curse.maven:${common.opcm_version}")

    compileOnly fg.deobf("${common.crft_version}")
    compileOnly fg.deobf("${common.zens_version}")

    implementation fg.deobf("curse.maven:${common.ppfx_version}")
    implementation fg.deobf("curse.maven:${common.cfga_version}")

    implementation fg.deobf("curse.maven:${common.liti_version}")
    implementation fg.deobf("curse.maven:${common.crce_version}")

    annotationProcessor 'org.ow2.asm:asm-debug-all:5.2'
    annotationProcessor 'com.google.guava:guava:32.1.2-jre'
    annotationProcessor 'com.google.code.gson:gson:2.8.9'
    implementation fg.deobf('zone.rong:mixinbooter:10.7') { transitive = false }
    annotationProcessor('zone.rong:mixinbooter:10.7') { transitive = false }
}

minecraft {
    accessTransformers { file('src/main/resources/META-INF/it_at.cfg') }
    mappings channel: 'stable', version: "${common.mcp_mappings}"
    runs {
        client {
            workingDirectory project.file('run')
            args '--width', '1920'
            args '--height', '1080'
            args '--add-opens=java.base/java.lang=ALL-UNNAMED'
            args '--version', common.mcversion
            args '--username', 'tgstyle'
            property 'forge.logging.console.level', 'debug'
            property 'fml.coreMods.load', 'mctmods.immersivetechnology.core.MCTMixin'
            mods {
                "${archivesBaseName}" {
                    source sourceSets.main
                }
            }
        }
        server {
            workingDirectory project.file('run/server')
            args '--version', common.mcversion
            property 'forge.logging.console.level', 'debug'
            property 'fml.coreMods.load', 'mctmods.immersivetechnology.core.MCTMixin'
            mods {
                "${archivesBaseName}" {
                    source sourceSets.main
                }
            }
        }
    }
}

tasks.withType(JavaExec).configureEach { task ->
    if (task.name in ['runClient', 'runServer']) {
        doFirst {
            def modJar = project.file("build/libs/${archivesBaseName}-${version}.jar")
            if (modJar.exists()) {
                println "Removing JAR from classpath: ${modJar}"
                def newClasspath = classpath.minus(modJar).plus(sourceSets.main.output)
                classpath.setFrom(newClasspath)
            }
            println "Classpath files: ${classpath.files.collect { it.absolutePath }.join(', ')}"
        }
    }
}

compileJava.doLast {
    copy {
        from "build/tmp/compileJava"
        include "**/*-refmap.json"
        into sourceSets.main.output.resourcesDir
        rename { String fileName -> "mixins.immersivetech.refmap.json" }
    }
}

tasks.register('bumpVersion') {
    doLast {
        def requested = gradle.startParameter.taskNames*.toLowerCase()
        if (!requested.any { it.contains('build') || it.contains('jar') || it.contains('assemble') }) { return }

        def props = new Properties()
        file('version.properties').withInputStream { props.load(it) }
        def currentBuild = props['build_number'].toInteger()
        def nextBuild = currentBuild + 1
        props['build_number'] = nextBuild.toString()
        file('version.properties').withOutputStream { props.store(it, null) }

        ext.version_buildnumber = nextBuild
        def newStage = props['stage'] ?: ''
        def newVersion = "${common.mcversion}-${props['version']}.${nextBuild}-${newStage}"

        project.version = newVersion
        tasks.withType(Jar).configureEach {
            it.archiveVersion.set(newVersion)
        }
    }
}

build.dependsOn bumpVersion
processResources.dependsOn bumpVersion
jar.dependsOn bumpVersion

processResources {
    inputs.property 'version', "${modversion}.${version_buildnumber}"
    inputs.property 'mcversion', common.mcversion
    filesMatching('mcmod.info') {
        expand 'version': "${modversion}.${version_buildnumber}", 'mcversion': common.mcversion
    }
    duplicatesStrategy = DuplicatesStrategy.INCLUDE
}

fancyGradle {
    patches {
        resources
        asm
        coremods
        codeChickenLib
        mergetool
    }
}

jar {
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    manifest {
        attributes(
                'FMLCorePlugin': 'mctmods.immersivetechnology.core.MCTMixin',
                'FMLCorePluginContainsFMLMod': 'true'
        )
    }
}

sourceSets.configureEach { it.output.resourcesDir = it.output.classesDirs.getFiles().iterator().next() }

tasks.register('optimizePng') {
    dependsOn processResources
    doLast {
        File resourcesDir = sourceSets.main.output.resourcesDir
        if (resourcesDir == null || !resourcesDir.exists()) {
            println 'No processed resources directory - skipping PNG optimization.'
            return
        }

        boolean optipngAvailable = true
        fileTree(dir: resourcesDir, includes: ['**/*.png']).each { File file ->
            if (!optipngAvailable) return

            long size = file.length()
            try {
                exec {
                    executable 'optipng'
                    args '-q', '-o7', '-nx', '-zm1-9', file.absolutePath
                }
                long newSize = file.length()
                if (newSize < size) {
                    double percent = 100.0 * (size - newSize) / size
                    System.out.printf('Optimized %s: %d -> %d bytes (%.2f%% reduction)%n',
                            resourcesDir.toPath().relativize(file.toPath()), size, newSize, percent)
                }
            } catch (Exception e) {
                System.out.println("optipng not found or failed (${e.message}). Skipping remaining PNG optimizations.")
                optipngAvailable = false
            }
        }
    }
}
