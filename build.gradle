buildscript {
    repositories {
        maven { url = 'https://files.minecraftforge.net/maven' }
        mavenCentral()
    	gradlePluginPortal()
    }
    dependencies {
        classpath group: 'net.minecraftforge.gradle', name: 'ForgeGradle', version: '5.1+', changing: true
        classpath "gradle.plugin.com.github.johnrengelman:shadow:7.1.2"
    }
}


apply plugin: 'net.minecraftforge.gradle'
apply plugin: 'java'

ext.configFile = file "../common/common-1.12.properties"
configFile.withReader {
    def prop = new Properties()
    prop.load(it)
    ext.common = new ConfigSlurper().parse prop
}

java.toolchain.languageVersion = JavaLanguageVersion.of(8)
compileJava {
	sourceCompatibility = "8"
	targetCompatibility = "8"
}

repositories {
    maven { url = 'https://www.cursemaven.com' }
    maven { url = 'https://jitpack.io' }
}

version = common.mcversion + "-" + modversion + "." + modsubversion
group = modgroup
archivesBaseName = modarchivename

dependencies {
    minecraft "net.minecraftforge:forge:${common.mcversion}-${common.forgeversion}"

    implementation fg.deobf("curse.maven:${common.jei_version}")
    implementation fg.deobf("curse.maven:${common.imme_version}")

    compileOnly fg.deobf("curse.maven:${common.top_version}")
    compileOnly fg.deobf("curse.maven:${common.hwya_version}")

    compileOnly fg.deobf("curse.maven:${common.ar_version}")
    compileOnly fg.deobf("curse.maven:${common.lv_version}")
    
    implementation fg.deobf("curse.maven:${common.crft_version}")
    compileOnly fg.deobf("curse.maven:${common.opcm_version}")
}

minecraft {
    mappings channel: 'snapshot', version: "${common.mcp_mappings}"

    runs {
        client {
            workingDirectory project.file('run')
            property 'forge.logging.markers', 'REGISTRIES'
            property 'forge.logging.console.level', 'debug'
            mods {
                "${archivesBaseName}" {
                    source sourceSets.main
                }
            }
        }

        server {
            workingDirectory project.file('run')
            property 'forge.logging.markers', 'REGISTRIES'
            property 'forge.logging.console.level', 'debug'
            mods {
                "${archivesBaseName}" {
                    source sourceSets.main
                }
            }
        }
    }
}

processResources {
    inputs.property "version", modversion + "." + modsubversion
    inputs.property "mcversion", common.mcversion  // Changed to use common.mcversion directly

    from(sourceSets.main.resources.srcDirs) {
        include "mcmod.info"

        expand "version": modversion + "." + modsubversion, "mcversion": common.mcversion
    }

    from(sourceSets.main.resources.srcDirs) {
        exclude "mcmod.info"
    }
}

sourceSets.all { it.output.resourcesDir = it.output.classesDirs.getFiles().iterator().next() }