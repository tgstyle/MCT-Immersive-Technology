def version_replaces = { [
        'version'      : project.version,
        'build_number' : version_buildnumber,
        'version_mc'   : version_minecraft,
        'version_forge': version_forge,
        'version_forge_min': version_forge_min,
        'version_jei'  : version_jei,
        'mod_license'  : mod_license,
        'mod_name'     : mod_name,
        'mod_authors'  : mod_authors,
        'mod_description': mod_description,
        'version_ie'   : version_ie_full,
        'version_ic'   : version_ic,
        'stage'        : stage,
] as Map<String, Object> }

def jsonPatterns = ["**/*.json", "**/*.mcmeta"]

processResources {
    duplicatesStrategy = DuplicatesStrategy.FAIL
    inputs.properties(version_replaces())
    filesMatching("META-INF/mods.toml") {
        expand version_replaces()
    }
    exclude ".cache"
    doLast {
        fileTree(dir: getOutputs().getFiles().getAsPath(), includes: jsonPatterns).each {
            File file -> file.setText(JsonOutput.toJson(new JsonSlurper().parse(file, 'UTF-8')))
        }
    }
}

tasks.register('copyModsTomlForIntelliJ', Copy) {
    from processResources.destinationDir
    into "$projectDir/out/production/resources"
    include "META-INF/mods.toml"
    dependsOn processResources
}

def devSyncScript = null
for (def dir = rootDir; dir != null && devSyncScript == null; dir = dir.parentFile) {
    def candidate = new File(dir, '#scripts/mods-devsync.gradle')
    if (candidate.isFile()) { devSyncScript = candidate }
}
if (devSyncScript != null) { apply from: devSyncScript }

def icJar = devSyncScript == null ? null : devSyncStaged(devSyncPin('ImmersiveConvergence', versionProps['devsync_ic']), 'build/devsync-pins/ImmersiveConvergence.jar')
if (icJar == null) { logger.warn('No IC devSync pin: set devsync_ic in version.properties to a snapshot in the devsync cache; falling back to CurseMaven') }

def ifJar = devSyncScript == null ? null : devSyncStaged(devSyncPin('Immersive-Fixes', versionProps['devsync_if']), 'build/devsync-pins/Immersive-Fixes.jar')
if (ifJar == null) { logger.warn('No Immersive Fixes devSync pin: set devsync_if in version.properties to a snapshot in the devsync cache') }

legacyForge {
    version = "${version_minecraft}-${version_forge}"

    parchment {
        mappingsVersion = project.version_parchment
        minecraftVersion = project.version_minecraft
    }

    accessTransformers.from file('src/main/resources/META-INF/accesstransformer.cfg')
    validateAccessTransformers = true

    mods {
        register(mod_id.toString()) { net.neoforged.moddevgradle.dsl.ModModel mod ->
            SourceSetContainer sets = project.extensions.getByType(SourceSetContainer)
            mod.modSourceSets.add(sets.named('main'))
            mod.modSourceSets.add(sets.named('datagen'))
            mod.modSourceSets.add(sets.named('gametest'))
        }
    }

    runs {
        configureEach {
            jvmArgument '-Xmx4G'
        }
        client {
            client()
            sourceSet = sourceSets.main
            systemProperty 'forge.logging.markers', ''
            systemProperty 'forge.enabledGameTestNamespaces', mod_id.toString()
            jvmArgument '-XX:StartFlightRecording=maxsize=512M,dumponexit=true,filename=logs/profile.jfr,settings=profile'
            programArguments.addAll '--username', 'tgstyle', '--width', '1920', '--height', '1080'
        }
        server {
            server()
            sourceSet = sourceSets.main
            systemProperty 'forge.logging.markers', ''
            systemProperty 'forge.enabledGameTestNamespaces', mod_id.toString()
            jvmArgument '-XX:StartFlightRecording=maxsize=512M,dumponexit=true,filename=logs/profile.jfr,settings=profile'
            programArguments.addAll '--nogui'
        }
        data {
            data()
            sourceSet = sourceSets.datagen
            systemProperty 'forge.logging.markers', ''
            systemProperty 'fml.earlyprogresswindow', 'false'
            programArguments.addAll '--mod', mod_id.toString(), '--all',
                    '--output', file('src/generated/resources/').getAbsolutePath(), '--validate',
                    '--existing', file('src/main/resources/').getAbsolutePath()
        }
        gameTestServer {
            type = 'gameTestServer'
            sourceSet = sourceSets.gametest
            systemProperty 'forge.logging.markers', ''
            systemProperty 'forge.enabledGameTestNamespaces', mod_id.toString()
        }
        configureEach {
            gameDirectory = layout.projectDirectory.dir('run')
        }
    }
}

