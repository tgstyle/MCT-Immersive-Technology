pluginManagement {
    repositories {
        gradlePluginPortal()
        maven { url = 'https://maven.neoforged.net/releases' }
        // maven.parchmentmc.org is offline (connection refused); this mirror
        // serves the same artifacts. Leaving the dead host here fails every
        // dynamic-version plugin resolve once its 24h cache expires.
        maven { url = 'https://ldtteam.jfrog.io/artifactory/parchmentmc-public/' }
        mavenCentral()
        maven { url = 'https://repo.spongepowered.org/repository/maven-public/' }
    }
}

plugins {
    id 'org.gradle.toolchains.foojay-resolver-convention' version '0.9.0'
}

rootProject.name = 'MCT-Immersive-Technology'
